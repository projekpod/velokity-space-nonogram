<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
        <title>$GODOT_PROJECT_NAME</title>
        <style>
            html, body, #canvas {
                margin: 0;
                padding: 0;
                border: 0;
            }

            body {
                color: white;
                background-color: black;
                overflow: hidden;
                touch-action: none;
            }

            #canvas {
                display: block;
            }

            @media (max-width: 599px), (orientation: portrait) {
                #banner-container { display: none !important; }
            }

            #canvas:focus {
                outline: none;
            }

            #status, #status-splash, #status-progress {
                position: absolute;
                left: 0;
                right: 0;
            }

            #status, #status-splash {
                top: 0;
                bottom: 0;
            }

            #status {
                background-color: #242424;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                visibility: hidden;
            }

            #status-splash {
                max-height: 100%;
                max-width: 100%;
                margin: auto;
            }

            #status-progress, #status-notice {
                display: none;
            }

            #status-progress {
                bottom: 10%;
                width: 50%;
                margin: 0 auto;
            }

            #status-notice {
                background-color: #5b3943;
                border-radius: 0.5rem;
                border: 1px solid #9b3943;
                color: #e0e0e0;
                font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
                line-height: 1.3;
                margin: 0 2rem;
                overflow: hidden;
                padding: 1rem;
                text-align: center;
                z-index: 1;
            }

        </style>
        $GODOT_HEAD_INCLUDE
    </head>
    <body>
        <canvas id="canvas">
            Your browser does not support the canvas tag.
        </canvas>

        <noscript>
            Your browser does not support JavaScript.
        </noscript>

        <div id="status">
            <img id="status-splash" src="$GODOT_SPLASH" alt="">
            <progress id="status-progress"></progress>
            <div id="status-notice"></div>
        </div>

        <script src="./playgama-bridge.js"></script>
        <script src="$GODOT_URL"></script>
        <script>
            const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
            const engine = new Engine($GODOT_CONFIG);
            const canvas = document.getElementById('canvas');
            const loadingStatus = document.getElementById('status');
            const progress = document.getElementById('status-progress');

            // Bridge v2.4.4 mounts in-frame sticky ads in this container.
            window.velokityBannerHeight = () => {
                const banner = document.getElementById('banner-container');
                if (!banner?.getClientRects().length || getComputedStyle(banner).visibility === 'hidden') return 0;
                const bounds = banner.getBoundingClientRect();
                if (!bounds.width || !bounds.height) return 0;
                let top = bounds.top;
                for (const frame of banner.querySelectorAll('iframe')) {
                    const rect = frame.getBoundingClientRect();
                    if (rect.width && rect.height && getComputedStyle(frame).visibility !== 'hidden') {
                        top = Math.min(top, rect.top);
                    }
                }
                return Math.max(0, Math.min(window.innerHeight, window.innerHeight - top));
            };

            async function start() {
                loadingStatus.style.visibility = 'visible';
                const sdk = window.bridge;
                let timeout;
                try {
                    if (sdk) {
                        sdk.engine = 'godot-4';
                        await Promise.race([
                            sdk.initialize(),
                            new Promise((_, reject) => {
                                timeout = setTimeout(() => reject(new Error('Initialization timed out')), 12000);
                            }),
                        ]);
                        sdk.setGameLoadingProgress(0);
                    }
                } catch (error) {
                    console.error('Velokity: Playgama Bridge initialization failed.', error);
                    window.bridge = null;
                } finally {
                    clearTimeout(timeout);
                }

                try {
                    await engine.startGame({
                        onProgress(current, total) {
                            if (total > 0) {
                                progress.style.display = 'block';
                                progress.max = total;
                                progress.value = current;
                                window.bridge?.setGameLoadingProgress(current / total * 100);
                            }
                        },
                    });
                    loadingStatus.remove();
                    canvas.focus();
                } catch (error) {
                    document.getElementById('status-splash').style.display = 'none';
                    progress.style.display = 'none';
                    const notice = document.getElementById('status-notice');
                    notice.textContent = String(error);
                    notice.style.display = 'block';
                    console.error(error);
                }
            }

            start();
        </script>
    </body>
</html>
