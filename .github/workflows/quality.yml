name: Quality gates

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A unique group for each main run also preserves runs that are still queued.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'codex/') }}
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test Autopilot
        run: node --test .github/autopilot/*.test.mjs
      - uses: actions/cache@v5
        id: godot
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-linux-x86_64-${{ env.GODOT_VERSION }}-stable
      - name: Install Godot and export templates
        if: steps.godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          tag="$GODOT_VERSION-stable"
          base="https://github.com/godotengine/godot/releases/download/$tag"
          editor="Godot_v${tag}_linux.x86_64"
          curl -fsSL --retry 3 "$base/$editor.zip" -o godot.zip
          curl -fsSL --retry 3 "$base/Godot_v${tag}_export_templates.tpz" -o templates.tpz
          sha256sum -c <<'CHECKSUMS'
          cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip
          f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz
          CHECKSUMS
          unzip -q godot.zip
          unzip -q templates.tpz
          install -Dm755 "$editor" "$HOME/.local/bin/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv templates "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Import
        shell: bash
        run: godot --headless --import 2>&1 | tee /tmp/velokity-import.log
      - name: Tests
        shell: bash
        run: godot --headless -s res://tests/run_tests.gd 2>&1 | tee /tmp/velokity-tests.log
      - name: Check puzzle uniqueness
        run: |
          python3 -m unittest discover -s tools
          python3 tools/check_levels.py
      - name: Export Web
        shell: bash
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html 2>&1 | tee /tmp/velokity-export.log
      - name: Export Web QA
        shell: bash
        run: |
          mkdir -p build/web-qa
          godot --headless --export-release 'Web QA' build/web-qa/index.html 2>&1 | tee /tmp/velokity-export-qa.log
      - name: Reject Godot errors and warnings
        run: |
          if grep -E '(^|[[:space:]])(ERROR|WARNING):' /tmp/velokity-{import,tests,export,export-qa}.log; then
            exit 1
          fi
      - name: Report Web build size
        shell: bash
        run: python3 tools/report_web_size.py build/web | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Package itch.io Web build
        run: python3 tools/package_itch.py build/web build/velokity-itch.zip
      - uses: actions/upload-artifact@v6
        with:
          name: velokity-itch
          path: build/velokity-itch.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: velokity-web
          path: build/web/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: velokity-web-qa
          path: build/web-qa/
          if-no-files-found: error

  qa-screenshots:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: velokity-web
          path: build/web/
      - uses: actions/download-artifact@v8
        with:
          name: velokity-web-qa
          path: build/web-qa/
      - uses: actions/download-artifact@v8
        with:
          name: velokity-itch
          path: build/
      - name: Install Playwright and Chromium
        working-directory: .github/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Ensure FFmpeg is installed
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Verify Web gameplay and capture QA screens, store art, and preview videos
        shell: bash
        run: |
          python3 -m http.server --bind 127.0.0.1 8765 --directory build &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          if ! curl --retry 10 --retry-connrefused --fail --silent \
            http://127.0.0.1:8765/web-qa/index.html --output /dev/null; then
            echo "Web QA server did not start"
            exit 1
          fi
          node .github/qa/preview-video.mjs http://127.0.0.1:8765/ build/store-videos
          node .github/qa/capture.mjs http://127.0.0.1:8765/ build/qa-screenshots
          node .github/qa/release-check.mjs http://127.0.0.1:8765/
          python3 -m zipfile -e build/velokity-itch.zip build/itchio
          node .github/qa/itch-check.mjs http://127.0.0.1:8765/
          node .github/qa/store-art.mjs http://127.0.0.1:8765/ build/store
      - uses: actions/upload-artifact@v6
        with:
          name: velokity-qa-screenshots
          path: build/qa-screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: velokity-store-videos
          path: build/store-videos/*.mp4
          if-no-files-found: error

  publish-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [web, qa-screenshots]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.retry-deployment.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: velokity-web
          path: build/web/
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: build/web/
      - uses: actions/deploy-pages@v5
        id: deployment
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@v5
        id: retry-deployment
        if: steps.deployment.outcome == 'failure'
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
